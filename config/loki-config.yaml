# Loki 3.7.x — monolithic (single binary), S3 (R2) backend.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  http_server_write_timeout: 310s
  http_server_read_timeout: 310s
  log_level: info

common:
  path_prefix: /loki # persisted by the loki-data volume (WAL, TSDB index cache, compactor)
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: ${LOKI_BUCKET_ENDPOINT}
      bucketnames: ${LOKI_BUCKET_NAME}
      access_key_id: ${LOKI_ACCESS_KEY}
      secret_access_key: ${LOKI_SECRET_KEY}
      s3forcepathstyle: true
      region: auto

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_encoding: snappy
  chunk_idle_period: 2h
  max_chunk_age: 2h
  chunk_target_size: 1572864 # 1.5 MiB
  wal:
    enabled: true

# Feeds Grafana Logs Drilldown (patterns tab).
pattern_ingester:
  enabled: true

querier:
  max_concurrent: 8

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  # Without these two settings limits_config.retention_period is never applied.
  retention_enabled: true
  delete_request_store: s3
  retention_delete_delay: 2h

limits_config:
  retention_period: 744h # 31d
  ingestion_rate_mb: 20
  ingestion_burst_size_mb: 30
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 10MB
  max_query_parallelism: 24
  split_queries_by_interval: 15m
  query_timeout: 300s
  allow_structured_metadata: true
  # Needed by Grafana Logs Drilldown (volume panels and level detection).
  volume_enabled: true
  discover_log_levels: true

ruler:
  storage:
    type: s3
    s3:
      endpoint: ${LOKI_BUCKET_ENDPOINT}
      bucketnames: ${LOKI_RULES_BUCKET_NAME}
      access_key_id: ${LOKI_ACCESS_KEY}
      secret_access_key: ${LOKI_SECRET_KEY}
      s3forcepathstyle: true
      region: auto

analytics:
  reporting_enabled: false
