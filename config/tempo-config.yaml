# Tempo 3.1.x — monolithic (target: all). No Kafka needed in monolithic mode:
# the live-store replaces the 2.x ingester and the backend scheduler/worker
# replace the compactor.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Retention (was compactor.compaction.block_retention in 2.x).
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 1440h # 60d

backend_worker:
  compaction:
    block_retention: 1440h
  ring:
    kvstore:
      store: inmemory

metrics_generator:
  processor:
    service_graphs:
      histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]
      dimensions: ['http.method', 'http.target']
      enable_virtual_node_label: true
      peer_attributes: ["peer.service", "db.name", "db.system"]
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: s3
    s3:
      bucket: ${TEMPO_BUCKET_NAME}
      endpoint: ${TEMPO_BUCKET_ENDPOINT}
      access_key: ${TEMPO_ACCESS_KEY}
      secret_key: ${TEMPO_SECRET_KEY}
      region: auto
    wal:
      path: /var/tempo/wal # persisted by the tempo-data volume

query_frontend:
  search:
    duration_slo: 30s
    throughput_bytes_slo: 1.073741824e+09
    max_duration: 168h
  trace_by_id:
    duration_slo: 60s
  metrics:
    max_duration: 336h
    max_exemplars: 100000

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs]

usage_report:
  reporting_enabled: false
