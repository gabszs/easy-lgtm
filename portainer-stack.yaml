version: '3.8'

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    user: "0:0"
    env_file:
      - stack.env
    ports:
      - 13133:13133
      - 4317:4317
      - 4318:4318
      - 1888:1888
      - 8859:8889
    depends_on:
      - loki
      - mimir
      - tempo
      - pyroscope
      - prometheus
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /root/easy-lgtm/config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command:
      - --config=/etc/otel-collector-config.yaml
      - --feature-gates=service.profilesSupport,receiver.postgresql.separateSchemaAttr

  # alloy:
  #   image: grafana/alloy:latest
  #   container_name: alloy
  #   restart: unless-stopped
  #   env_file:
  #     - stack.env
  #   ports:
  #     - 12345:12345
  #     - 4517:4317
  #     - 4518:4318
  #   volumes:
  #     - /root/easy-lgtm/config/alloy-config.yaml:/etc/alloy/config.alloy
  #   command:
  #     - run
  #     - /etc/alloy/config.alloy
  #     - --server.http.listen-addr=0.0.0.0:12345
  #     - --storage.path=/var/lib/alloy/data
  #     - --cluster.node-name=${ALLOY_NODE_NAME}
  #     - --stability.level=public-preview

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      - /root/easy-lgtm/config/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver # Prometheus 3 dropped --enable-feature=remote-write-receiver
      - --enable-feature=exemplar-storage

  mimir:
    image: grafana/mimir:3.2.1
    container_name: mimir
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - /root/easy-lgtm/config/mimir-config.yaml:/etc/mimir.yaml
      - mimir-data:/data
    command:
      - --config.file=/etc/mimir.yaml
      - --config.expand-env=true

  pyroscope:
    image: grafana/pyroscope:2.3.1
    container_name: pyroscope
    restart: unless-stopped
    user: "0:0"
    ports:
      - "4040:4040"
      - "4041:4041"
    env_file:
      - stack.env
    volumes:
      - /root/easy-lgtm/config/pyroscope-config.yaml:/etc/pyroscope/server.yaml
      - pyroscope-data:/data/pyroscope
    command:
      - --config.file=/etc/pyroscope/server.yaml
      - --config.expand-env=true

  loki:
    image: grafana/loki:3.7.8
    container_name: grafana-loki
    restart: unless-stopped
    ports:
      - 3100:3100
    env_file:
      - stack.env
    volumes:
      - /root/easy-lgtm/config/loki-config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml -config.expand-env=true

  tempo:
    image: grafana/tempo:3.1.0
    container_name: grafana-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
    env_file:
      - stack.env
    volumes:
      - /root/easy-lgtm/config/tempo-config.yaml:/etc/tempo/tempo-config.yaml
      - tempo-data:/var/tempo
    command: -target=all -config.file=/etc/tempo/tempo-config.yaml -config.expand-env=true

  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - stack.env
    volumes:
      - /root/easy-lgtm/config/grafana/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/grafana-dashboards.yaml
      - /root/easy-lgtm/config/grafana/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - /root/easy-lgtm/dashboards:/var/lib/grafana/dashboards

volumes:
  pyroscope-data:
  prometheus-data:
  loki-data:
  mimir-data:
  tempo-data:
